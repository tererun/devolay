name: Multi-Platform Build

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDI SDK
        run: |
          # Use headers from repo
          mkdir -p "NDI SDK for Apple/include"
          cp -r ndi-sdk/include/* "NDI SDK for Apple/include/"
          
          # Try to get NDI runtime for integrated builds
          brew install --cask ndi-tools 2>/dev/null || true
          
          if [ -d "/Library/NDI SDK for Apple/lib" ]; then
            cp -r "/Library/NDI SDK for Apple/lib" "NDI SDK for Apple/"
          fi
          
          ls -la "NDI SDK for Apple/" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build natives for macOS
        run: |
          ./gradlew :devolay-natives:assembleReleaseMacosArm64 :devolay-natives:assembleReleaseMacosX86-64
          echo "=== Build output ==="
          find devolay-natives/build -name "*.dylib" 2>/dev/null || true

      - name: Upload macOS natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos
          path: devolay-natives/build/lib/main/release/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDI SDK
        shell: pwsh
        run: |
          # Use headers from repo
          New-Item -ItemType Directory -Force -Path "NDI SDK for Windows/Include"
          Copy-Item -Recurse -Path "ndi-sdk/include/*" -Destination "NDI SDK for Windows/Include/"

      - name: Build natives for Windows
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :devolay-natives:assembleReleaseWindowsX86-64 :devolay-natives:assembleReleaseWindowsX86
          echo "=== Build output ==="
          find devolay-natives/build -name "*.dll" 2>/dev/null || true

      - name: Upload Windows natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          path: devolay-natives/build/lib/main/release/
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDI SDK
        run: |
          # Use headers from repo
          mkdir -p "NDI SDK for Linux/include"
          cp -r ndi-sdk/include/* "NDI SDK for Linux/include/"

      - name: Install 32-bit support
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build natives for Linux
        run: |
          ./gradlew :devolay-natives:assembleReleaseLinuxX86-64 :devolay-natives:assembleReleaseLinuxX86
          echo "=== Build output ==="
          find devolay-natives/build -name "*.so" 2>/dev/null || true

      - name: Upload Linux natives
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux
          path: devolay-natives/build/lib/main/release/
          if-no-files-found: warn

  combine-and-publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download all natives
        uses: actions/download-artifact@v4
        with:
          path: collected-natives
        continue-on-error: true

      - name: Setup NDI SDK headers
        run: |
          mkdir -p "NDI SDK for Linux/include"
          cp -r ndi-sdk/include/* "NDI SDK for Linux/include/"

      - name: Prepare natives directory structure
        run: |
          mkdir -p devolay-natives/build/lib/main/release
          
          echo "=== Downloaded artifacts ==="
          find collected-natives -type f 2>/dev/null || true
          
          # Copy all platform natives
          for platform in macos windows linux; do
            if [ -d "collected-natives/natives-$platform" ]; then
              echo "Copying $platform natives..."
              cp -r collected-natives/natives-$platform/* devolay-natives/build/lib/main/release/ 2>/dev/null || true
            fi
          done
          
          echo "=== Final natives structure ==="
          find devolay-natives/build/lib -type f 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java classes only
        run: ./gradlew :devolay-java:compileJava :devolay-java:sourceJar :devolay-java:javadocJar

      - name: Create combined JAR manually
        run: |
          VERSION="2.1.1"
          mkdir -p devolay-java/build/libs
          mkdir -p jar-contents
          
          # Copy compiled classes
          cp -r devolay-java/build/classes/java/main/* jar-contents/
          
          # Copy natives from collected artifacts
          mkdir -p jar-contents/natives
          
          echo "=== Copying natives to JAR ==="
          for platform in macos windows linux; do
            if [ -d "collected-natives/natives-$platform" ]; then
              cp -r collected-natives/natives-$platform/* jar-contents/natives/ 2>/dev/null || true
            fi
          done
          
          echo "=== JAR contents structure ==="
          find jar-contents -type f
          
          # Create JAR
          cd jar-contents
          jar cf ../devolay-java/build/libs/devolay-${VERSION}.jar .
          cd ..
          
          echo "=== Created JARs ==="
          ls -la devolay-java/build/libs/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devolay-multiplatform
          path: devolay-java/build/libs/*
          if-no-files-found: warn

      - name: Create Maven Local structure
        run: |
          VERSION="2.1.1"
          GROUP_PATH="me/walkerknapp/devolay"
          MAVEN_DIR=~/.m2/repository/${GROUP_PATH}/${VERSION}
          
          mkdir -p ${MAVEN_DIR}
          cp devolay-java/build/libs/devolay-${VERSION}.jar ${MAVEN_DIR}/
          cp devolay-java/build/libs/devolay-${VERSION}-sources.jar ${MAVEN_DIR}/ 2>/dev/null || true
          cp devolay-java/build/libs/devolay-${VERSION}-javadoc.jar ${MAVEN_DIR}/ 2>/dev/null || true
          
          # Create minimal POM
          cat > ${MAVEN_DIR}/devolay-${VERSION}.pom << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>me.walkerknapp</groupId>
            <artifactId>devolay</artifactId>
            <version>2.1.1</version>
            <packaging>jar</packaging>
          </project>
          EOF
          
          echo "=== Maven Local structure ==="
          find ~/.m2/repository/${GROUP_PATH} -type f

      - name: Upload Maven Local artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-local-artifacts
          path: ~/.m2/repository/me/walkerknapp/devolay/
          if-no-files-found: warn
